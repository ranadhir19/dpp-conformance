[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpp-conformance"
version = "0.1.0"
description = "Conformance checker for the Document Parsing Protocol (DPP draft 0.1): grade parser output against DPP's published expected outputs, rule by rule."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["document parsing", "conformance", "benchmark", "llamaindex", "dpp"]
dependencies = []

[project.optional-dependencies]
parsers = ["PyMuPDF>=1.24", "Pillow>=10", "docling>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
dpp-conformance = "dpp_conformance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
